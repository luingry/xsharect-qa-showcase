<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LAN Device QA Showcase</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#e9eef7;background:#0b1120}*{box-sizing:border-box}body{margin:0;min-width:320px}.shell{max-width:1100px;margin:auto;padding:24px}.card{background:#141d31;border:1px solid #2d3b58;border-radius:16px;padding:24px}.hidden{display:none!important}input,textarea,button{font:inherit}input,textarea{width:100%;padding:11px;border-radius:8px;border:1px solid #55627a;background:#0d1526;color:#fff}button{cursor:pointer;border:0;border-radius:8px;min-height:44px;padding:10px 14px;background:#52d6a5;color:#07130f;font-weight:700}.danger{background:#ff9f9f}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tabs button[aria-selected=true]{outline:3px solid #8bb6ff}.grid{display:grid;grid-template-columns:minmax(220px,1fr) 2fr;gap:18px}.notes-list{list-style:none;padding:0}.notes-list button{width:100%;text-align:left;background:#202d47;color:#fff;margin:4px 0}.status{color:#9df0c8;min-height:24px}.reconnect{position:fixed;inset:auto 20px 20px auto;background:#392130;padding:16px;border-radius:10px}textarea{min-height:180px}@media(max-width:640px){.shell{padding:12px}.grid{grid-template-columns:1fr}.card{padding:16px}}
</style></head><body><main class="shell"><header><p>Sanitized automation case study</p><h1>LAN Device QA Showcase</h1></header>
<section id="authCard" class="card"><h2>Connect to synthetic device</h2><label for="accessCode">Access code</label><input id="accessCode" autocomplete="off"><button id="connectButton">Connect</button><p id="authError" role="alert" class="hidden">Invalid access code.</p></section>
<section id="app" class="hidden"><nav class="tabs" aria-label="Demo sections"><button id="viewerTab" aria-selected="true">Viewer</button><button id="notesTab" aria-selected="false">Notes</button></nav><section id="viewerPanel" class="card"><h2>Viewer shell</h2><p>Connected to a synthetic LAN device.</p></section><section id="notesPanel" class="hidden"><div class="grid"><aside class="card"><button id="newNote">New note</button><ul id="notesList" class="notes-list" aria-label="Notes"></ul><p id="emptyNotes">No notes yet.</p></aside><section class="card"><h2>Note editor</h2><label for="noteTitle">Title</label><input id="noteTitle" placeholder="Untitled"><label for="noteBody">Body</label><textarea id="noteBody" aria-label="Note body"></textarea><p id="saveStatus" class="status" aria-live="polite"></p><button id="deleteNote" class="danger">Delete note</button></section></div></section></section></main><aside id="reconnectBanner" class="reconnect hidden" role="status">Connection interrupted. Reconnecting…</aside><script type="module" src="/app.js"></script></body></html>
